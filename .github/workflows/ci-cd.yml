name: Lost Found CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lostfound-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/lostfound-frontend

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lostfound_test
          POSTGRES_USER: lostfound
          POSTGRES_PASSWORD: lostfound
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U lostfound -d lostfound_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Debug Workspace Files
        run: ls -la && ls -la database/

      - name: Load database schema
        run: psql postgresql://lostfound:lostfound@localhost:5432/lostfound_test -f database/schema.sql

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Docker login
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          build-args: |
            VITE_API_URL=${{ secrets.PROD_API_URL }}

  deploy:
    needs: test-and-build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            echo "Navigating to project directory..."
            cd /opt/lost-found-smart-portal/Lost-and-found

            echo "Pulling latest Docker images..."
            docker-compose pull

            echo "Starting containers..."
            docker-compose up -d

            echo "Cleaning unused images..."
            docker image prune -f

            echo "Checking backend health..."
            curl -f http://localhost:5000/health || true

            echo "Deployment completed successfully"