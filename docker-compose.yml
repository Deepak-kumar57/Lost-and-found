services:
  postgres:
    image: postgres:16-alpine
    container_name: lostfound-postgres
    environment:
      POSTGRES_DB: lostfound
      POSTGRES_USER: lostfound
      POSTGRES_PASSWORD: lostfound
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lostfound -d lostfound"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME:-local}/lostfound-backend:latest
    build: ./backend
    container_name: lostfound-backend
    env_file: ./backend/.env.example
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://lostfound:lostfound@postgres:5432/lostfound
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:8080}
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    restart: unless-stopped

  frontend:
    image: ${DOCKERHUB_USERNAME:-local}/lostfound-frontend:latest
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:5000
    container_name: lostfound-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
